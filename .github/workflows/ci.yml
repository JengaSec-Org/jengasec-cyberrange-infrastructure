name: checks
on:
  pull_request:
  push: { branches: [main] }

# Keep this small: a Free organisation has limited Actions minutes, and we would
# rather spend them on linting than on anything clever.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          pipx install yamllint==1.38.0
      - name: Install Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Static checks
        run: make lint
