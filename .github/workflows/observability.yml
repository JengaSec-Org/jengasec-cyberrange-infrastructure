name: observability

on:
  pull_request:
    paths:
      - .github/workflows/observability.yml
      - ansible/observability*.yml
      - ansible/requirements.txt
      - ansible/roles/observability*/**
      - ansible/site.yml
      - Makefile
      - contracts/**
      - charts/observability-agent/**
      - observability/**
      - scripts/render-observability-lookups.py
      - scripts/render-vector-catalogue.py
      - scripts/*infrastructure*.py
      - scripts/*provisioning*.py
      - scripts/render-grafana-dashboards.py
      - scripts/prepare-observability-runtime.py
      - scripts/prepare-observability-storage.py
      - scripts/provision-grafana-access.py
      - scripts/smoke-observability.sh
      - scripts/start-observability.sh
      - scripts/stop-observability.sh
      - scripts/sync-observability-lookups.sh
      - scripts/validate-observability.sh
      - scripts/validate-observability-vm.sh
      - scripts/fingerprint-observability-release.py
      - scripts/export-observability-evidence.py
      - scripts/refresh-observability-state.sh
      - scripts/wait-observability-stack.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/observability.yml
      - ansible/observability*.yml
      - ansible/requirements.txt
      - ansible/roles/observability*/**
      - ansible/site.yml
      - Makefile
      - contracts/**
      - charts/observability-agent/**
      - observability/**
      - scripts/render-observability-lookups.py
      - scripts/render-vector-catalogue.py
      - scripts/*infrastructure*.py
      - scripts/*provisioning*.py
      - scripts/render-grafana-dashboards.py
      - scripts/prepare-observability-runtime.py
      - scripts/prepare-observability-storage.py
      - scripts/provision-grafana-access.py
      - scripts/smoke-observability.sh
      - scripts/start-observability.sh
      - scripts/stop-observability.sh
      - scripts/sync-observability-lookups.sh
      - scripts/validate-observability.sh
      - scripts/validate-observability-vm.sh
      - scripts/fingerprint-observability-release.py
      - scripts/export-observability-evidence.py
      - scripts/refresh-observability-state.sh
      - scripts/wait-observability-stack.sh

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install smoke-check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gdisk fdisk e2fsprogs
          python3 -m venv /tmp/jengasec-ansible-venv
          /tmp/jengasec-ansible-venv/bin/pip install -r ansible/requirements.txt
          curl --fail --silent --show-error --location --output /tmp/helm-v3.19.0-linux-amd64.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output /tmp/helm-v3.19.0-linux-amd64.tar.gz.sha256sum https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          (cd /tmp && sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum)
          tar --extract --gzip --file /tmp/helm-v3.19.0-linux-amd64.tar.gz --directory /tmp linux-amd64/helm
          sudo install --mode=0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Verify guarded spare-disk provisioning
        run: sudo bash observability/tests/test-storage.sh
      - name: Check the OBS-only deployment entrypoint
        run: |
          for playbook in ansible/observability*.yml; do
            /tmp/jengasec-ansible-venv/bin/ansible-playbook -i localhost, "$playbook" --syntax-check
          done
      - name: Rehearse OBS VM deployment
        run: PATH="/tmp/jengasec-ansible-venv/bin:$PATH" make obs-vm-validate
      - name: Validate configs, builds and contracts
        run: make obs-validate
      - name: Start observability stack
        run: |
          make obs-up
          make obs-up
      - name: Prove event and metric ingestion
        run: make obs-smoke
      - name: Capture service logs after failure
        if: failure()
        run: docker compose -f observability/compose.yaml logs --no-color --tail=200
      - name: Stop observability stack
        if: always()
        run: |
          make obs-down
          make obs-down
