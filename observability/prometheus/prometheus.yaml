global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: reference-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - reference-app:8080
        labels:
          cell: app-01
          enterprise: zawadi-bank

  - job_name: vector
    static_configs:
      - targets:
          - vector:9598
