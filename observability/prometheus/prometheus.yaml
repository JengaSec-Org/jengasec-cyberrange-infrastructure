global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: test-emitter
    metrics_path: /metrics
    static_configs:
      - targets:
          - test-emitter:8080
        labels:
          application: APP01
          enterprise: ENT-A
          namespace: jengasec-ent-a-app01
          source: test

  - job_name: vector
    static_configs:
      - targets:
          - vector:9598
