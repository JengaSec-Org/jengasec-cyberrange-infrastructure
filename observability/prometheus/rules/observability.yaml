groups:
  - name: jengasec-observability
    rules:
      - alert: JengaSecTelemetryContractRejections
        expr: jengasec_contract_rejections_total > 0
        labels:
          severity: warning
        annotations:
          summary: Telemetry was rejected by the OBS contract

      - alert: JengaSecAttributionUnknown
        expr: jengasec_attribution_events_total{status="unknown"} > 0
        labels:
          severity: warning
        annotations:
          summary: Telemetry arrived without participant attribution

      - alert: JengaSecObservabilityTargetDown
        expr: up{job=~"vector|test-emitter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An observability pipeline target is down
