events {}

http {
  access_log off;
  server_tokens off;

  server {
    listen 9090;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /api/v1/write {
      limit_except POST {
        deny all;
      }
      client_max_body_size 32m;
      proxy_request_buffering off;
      proxy_pass http://prometheus:9090;
    }

    location / {
      return 404;
    }
  }
}
