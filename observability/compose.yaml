name: jengasec-observability

services:
  test-emitter:
    build:
      context: ./tests/fixtures/emitter
    environment:
      JENGASEC_APPLICATION: ${JENGASEC_APPLICATION:-APP01}
      JENGASEC_ENTERPRISE: ${JENGASEC_ENTERPRISE:-ENT-A}
      JENGASEC_NAMESPACE: ${JENGASEC_NAMESPACE:-jengasec-ent-a-app01}
    init: true
    labels:
      jengasec.observability.source: application
    ports:
      - "${JENGASEC_TEST_EMITTER_BIND:-127.0.0.1}:${JENGASEC_TEST_EMITTER_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12

  source-fixture:
    build:
      context: ./tests/fixtures/sources
    depends_on:
      goflow2:
        condition: service_started
    environment:
      JENGASEC_NETFLOW_HOST: goflow2
      JENGASEC_NETFLOW_PORT: 2055
      JENGASEC_OTLP_FIXTURE_FILE: /telemetry/kubernetes.jsonl
      JENGASEC_SYSLOG_HOST: vector
      JENGASEC_SYSLOG_TCP_PORT: 514
      JENGASEC_SYSLOG_UDP_PORT: 514
    init: true
    ports:
      - "${JENGASEC_SOURCE_FIXTURE_BIND:-127.0.0.1}:${JENGASEC_SOURCE_FIXTURE_PORT:-8081}:8081"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - otlp-fixture:/telemetry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12

  website-feed-mock:
    build:
      context: ./tests/fixtures/website-feed
    init: true
    ports:
      - "${JENGASEC_WEBSITE_FEED_BIND:-127.0.0.1}:${JENGASEC_WEBSITE_FEED_PORT:-8082}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - website-feed-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12

  goflow2:
    image: netsampler/goflow2:v2.2.7
    command:
      - -listen
      - netflow://:2055
      - -format
      - json
      - -transport
      - file
      - -loglevel
      - warn
      - -addr
      - :8080
    labels:
      jengasec.observability.source: netflow
    ports:
      - "${JENGASEC_NETFLOW_BIND:-127.0.0.1}:${JENGASEC_NETFLOW_PORT:-2055}:2055/udp"
    security_opt:
      - no-new-privileges:true
    volumes:
      - goflow-templates:/templates

  loki:
    image: grafana/loki:3.7.8
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    environment:
      JENGASEC_RETENTION_HOURS: ${JENGASEC_RETENTION_HOURS:-168}
    ports:
      - "${JENGASEC_LOKI_BIND:-127.0.0.1}:${JENGASEC_LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -config.file=/etc/loki/local-config.yaml
        - -config.expand-env=true
        - -verify-config=true
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  catalogue-renderer:
    build:
      context: ..
      dockerfile: observability/tests/Dockerfile
    entrypoint:
      - python
      - scripts/render-vector-catalogue.py
    command:
      - --catalogue
      - contracts/telemetry-event-catalogue.yaml
      - --cells
      - scripts/cells.yaml
      - --template
      - observability/vector/vector.yaml
      - --output-dir
      - /generated
      - --website-feed-url
      - ${JENGASEC_WEBSITE_FEED_URL:-http://website-feed-mock:8080/api/feed}
    volumes:
      - ..:/workspace:ro
      - vector-catalogue:/generated

  attribution-renderer:
    build:
      context: ..
      dockerfile: observability/tests/Dockerfile
    entrypoint:
      - python
      - scripts/render-observability-lookups.py
    command:
      - --ip-allocations
      - observability/tests/fixtures/attribution/ip-allocations.csv
      - --applications
      - observability/tests/fixtures/attribution/applications.csv
      - --scope-assignments
      - observability/tests/fixtures/attribution/scope-assignments.csv
      - --access-principals
      - observability/tests/fixtures/access/access-principals.csv
      - --output-dir
      - /generated
    depends_on:
      catalogue-renderer:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace:ro
      - vector-catalogue:/generated

  dashboard-renderer:
    build:
      context: ..
      dockerfile: observability/tests/Dockerfile
    entrypoint:
      - python
      - scripts/render-grafana-dashboards.py
    command:
      - --applications
      - observability/tests/fixtures/attribution/applications.csv
      - --output-dir
      - /dashboards
    volumes:
      - ..:/workspace:ro
      - grafana-dashboards:/dashboards

  vector:
    image: timberio/vector:0.58.0-debian
    environment:
      JENGASEC_DOCKER_SOURCE_PROJECT: ${COMPOSE_PROJECT_NAME:-jengasec-observability}
      JENGASEC_V2_TELEMETRY_ENVIRONMENT: rehearsal
    command:
      - --config
      - /etc/vector/generated/vector.yaml
    depends_on:
      attribution-renderer:
        condition: service_completed_successfully
      catalogue-renderer:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      source-fixture:
        condition: service_healthy
      test-emitter:
        condition: service_healthy
      website-feed-mock:
        condition: service_healthy
    ports:
      - "${JENGASEC_VECTOR_BIND:-127.0.0.1}:${JENGASEC_VECTOR_PORT:-9598}:9598"
      - "${JENGASEC_OTLP_BIND:-127.0.0.1}:${JENGASEC_OTLP_PORT:-4317}:4317"
      - "${JENGASEC_SYSLOG_BIND:-127.0.0.1}:${JENGASEC_SYSLOG_PORT:-1514}:514/tcp"
      - "${JENGASEC_SYSLOG_BIND:-127.0.0.1}:${JENGASEC_SYSLOG_PORT:-1514}:514/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-catalogue:/etc/vector/generated:ro
      - vector-quarantine:/var/lib/vector/quarantine
      - vector-ai-handoff:/var/lib/vector/ai-handoff
    healthcheck:
      test:
        - CMD
        - vector
        - validate
        - --skip-healthchecks
        - /etc/vector/generated/vector.yaml
      interval: 10s
      timeout: 5s
      retries: 6

  otel-collector:
    build:
      context: ./otel
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      vector:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    volumes:
      - otlp-fixture:/telemetry:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${JENGASEC_RETENTION_HOURS:-168}h
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    depends_on:
      source-fixture:
        condition: service_healthy
      test-emitter:
        condition: service_healthy
      vector:
        condition: service_healthy
    ports:
      - "${JENGASEC_PROMETHEUS_BIND:-127.0.0.1}:${JENGASEC_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:9090/-/ready
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus-scope-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.12.0
    command:
      - -insecure-listen-address=0.0.0.0:8080
      - -upstream=http://prometheus:9090
      - -label=namespace
      - -header-name=X-JengaSec-Namespace
      - -error-on-replace
      - -enable-label-apis
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - >-
        ${JENGASEC_PROMETHEUS_SCOPE_PROXY_BIND:-127.0.0.1}:${JENGASEC_PROMETHEUS_SCOPE_PROXY_PORT:-9091}:8080
    security_opt:
      - no-new-privileges:true

  grafana-admin-reset:
    image: grafana/grafana:13.2.3
    profiles:
      - tools
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        grafana cli --homepath /usr/share/grafana
        --config /etc/grafana/grafana.ini admin reset-admin-password
        --password-from-stdin < /run/secrets/grafana_admin_password &&
        chown -R 472:0 /var/lib/grafana
    environment:
      GF_LOG_LEVEL: error
    secrets:
      - grafana_admin_password
    user: "0"
    volumes:
      - grafana-data:/var/lib/grafana

  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      dashboard-renderer:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      prometheus-scope-proxy:
        condition: service_started
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: >-
        /var/lib/grafana/dashboards/staff/jengasec-observability.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
    ports:
      - "${JENGASEC_GRAFANA_BIND:-127.0.0.1}:${JENGASEC_GRAFANA_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/staff:ro
      - grafana-dashboards:/var/lib/grafana/dashboards/applications:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  grafana-access-provisioner:
    build:
      context: ..
      dockerfile: observability/tests/Dockerfile
    entrypoint:
      - python
      - scripts/provision-grafana-access.py
    command:
      - --grafana-url
      - http://grafana:3000
      - --admin-password-file
      - /run/secrets/grafana_admin_password
      - --user-passwords-file
      - /runtime/grafana-user-passwords.json
      - --access-principals
      - observability/tests/fixtures/access/access-principals.csv
      - --applications
      - observability/tests/fixtures/attribution/applications.csv
      - --dashboards-dir
      - /dashboards
    depends_on:
      dashboard-renderer:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    secrets:
      - grafana_admin_password
    volumes:
      - ..:/workspace:ro
      - ./.runtime:/runtime:ro
      - grafana-dashboards:/dashboards:ro

  contract-tests:
    profiles:
      - tests
    build:
      context: ..
      dockerfile: observability/tests/Dockerfile
    volumes:
      - ..:/workspace:ro

volumes:
  goflow-templates:
  grafana-data:
  grafana-dashboards:
  loki-data:
  otlp-fixture:
  prometheus-data:
  vector-catalogue:
  vector-quarantine:
  vector-ai-handoff:
  website-feed-data:

secrets:
  grafana_admin_password:
    file: ./.runtime/grafana-admin-password
