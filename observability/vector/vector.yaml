data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

enrichment_tables:
  event_catalogue:
    type: file
    file:
      path: /etc/vector/generated/event-catalogue.csv
      encoding:
        type: csv

  applications:
    type: file
    file:
      path: /etc/vector/generated/applications.csv
      encoding:
        type: csv

  ip_allocations:
    type: file
    file:
      path: /etc/vector/generated/ip-allocations.csv
      encoding:
        type: csv

  scope_assignments:
    type: file
    file:
      path: /etc/vector/generated/scope-assignments.csv
      encoding:
        type: csv

sources:
  application_logs:
    type: docker_logs
    include_labels:
      - jengasec.observability.source=application
      - com.docker.compose.project=${JENGASEC_DOCKER_SOURCE_PROJECT:-jengasec-observability}

  cluster_otlp:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318
    use_otlp_decoding:
      logs: false
      metrics: false
      traces: false

  netflow_decoder_logs:
    type: docker_logs
    include_labels:
      - jengasec.observability.source=netflow
      - com.docker.compose.project=${JENGASEC_DOCKER_SOURCE_PROJECT:-jengasec-observability}

  gateway_syslog_tcp:
    type: syslog
    address: 0.0.0.0:514
    mode: tcp

  gateway_syslog_udp:
    type: syslog
    address: 0.0.0.0:514
    mode: udp

  infrastructure_http:
    type: http_server
    address: 0.0.0.0:8687
    path: /
    decoding:
      codec: bytes
    framing:
      method: newline_delimited
    acknowledgements:
      enabled: true

  vector_metrics:
    type: internal_metrics

transforms:
  prepare_application:
    type: remap
    inputs:
      - application_logs
    source: |
      . = {
        "input_kind": "application",
        "source_hint": "application",
        "raw_message": string!(.message)
      }

  prepare_cluster:
    type: remap
    inputs:
      - cluster_otlp.logs
    source: |
      raw_message = if is_string(.message) {
        string!(.message)
      } else {
        encode_json(object!(.message))
      }
      decoded = parse_json(raw_message) ?? {}
      input_kind = if decoded.schema_version == "infrastructure/1.0" {
        "infrastructure"
      } else if exists(decoded.source) { "source" } else { "application" }
      . = {
        "input_kind": input_kind,
        "source_hint": "otlp",
        "raw_message": raw_message
      }

  prepare_infrastructure_http:
    type: remap
    inputs:
      - infrastructure_http
    source: |
      . = {
        "input_kind": "infrastructure",
        "source_hint": "https",
        "raw_message": string!(.message)
      }

  prepare_syslog:
    type: remap
    inputs:
      - gateway_syslog_tcp
      - gateway_syslog_udp
    source: |
      . = {
        "input_kind": "source",
        "source_hint": "syslog",
        "raw_message": string!(.message)
      }

  netflow_json:
    type: filter
    inputs:
      - netflow_decoder_logs
    condition: starts_with(string!(.message), "{")

  prepare_netflow:
    type: remap
    inputs:
      - netflow_json
    source: |
      observed_ts = .timestamp
      . = {
        "input_kind": "source",
        "source_hint": "netflow",
        "observed_ts": observed_ts,
        "raw_message": string!(.message)
      }

  reject_sensitive:
    type: remap
    inputs:
      - prepare_application
      - prepare_cluster
      - prepare_netflow
      - prepare_syslog
      - prepare_infrastructure_http
    drop_on_error: true
    reroute_dropped: true
    source: |
      raw_message = string!(.raw_message)
      assert!(
        !match(raw_message, r'(?i)"(?:__SENSITIVE_KEY_PATTERN__)"\s*:'),
        "catalogue sensitive key"
      )

  split_inputs:
    type: route
    inputs:
      - reject_sensitive
    route:
      application: .input_kind == "application"
      source: .input_kind == "source"
      infrastructure: .input_kind == "infrastructure"

  normalized_application:
    type: remap
    inputs:
      - split_inputs.application
    drop_on_error: true
    reroute_dropped: true
    source: |
      original = object!(parse_json!(string!(.raw_message)))

      allowed_fields = [
        "schema_version", "ts", "level", "enterprise", "application",
        "namespace", "event", "outcome", "request_id", "trace_id",
        "source_ip", "user_id", "target_id", "method", "path", "status",
        "action", "severity", "detail"
      ]
      for_each(keys(original)) -> |_index, key| {
        assert!(includes(allowed_fields, key), "unrecognized logging field")
      }

      assert_eq!(string!(original.schema_version), "2.0")
      level = string!(original.level)
      enterprise = string!(original.enterprise)
      application = string!(original.application)
      namespace = string!(original.namespace)
      raw_event = string!(original.event)
      outcome = string!(original.outcome)
      ts = parse_timestamp!(string!(original.ts), format: "%+")

      assert!(includes(["debug", "info", "warn", "error"], level))
      assert!(includes(["ENT-A", "ENT-B"], enterprise))
      assert!(match(application, r'^APP0[1-9]$'))
      assert_eq!(namespace, "jengasec-" + downcase(enterprise) + "-" + downcase(application))
      assert!(includes(["success", "failure", "denied", "error", "unknown"], outcome))

      application_record = get_enrichment_table_record!(
        "applications",
        {"namespace": namespace}
      )
      assert_eq!(string!(application_record.enterprise), enterprise)
      assert_eq!(string!(application_record.application), application)
      asset = string!(application_record.asset)

      mapping = get_enrichment_table_record!(
        "event_catalogue",
        {"source": "application", "application": application, "event": raw_event}
      )
      event_type = string!(mapping.event_type)
      severity = if exists(original.severity) {
        string!(original.severity)
      } else {
        string!(mapping.severity)
      }
      assert!(includes(["low", "medium", "high", "critical"], severity))

      allowed_detail_keys = if string!(mapping.detail_keys) == "" {
        []
      } else {
        split(string!(mapping.detail_keys), "|")
      }
      detail = if exists(original.detail) { object!(original.detail) } else { {} }
      for_each(keys(detail)) -> |_index, key| {
        assert!(includes(allowed_detail_keys, key), "detail key is not catalogued")
      }

      actor = {}
      metadata = detail
      metadata.level = level
      metadata.environment = get_env_var("JENGASEC_V2_TELEMETRY_ENVIRONMENT") ?? "rehearsal"
      assert!(includes(["live", "validation", "rehearsal"], metadata.environment))
      verdict = "not_applicable"
      if exists(original.source_ip) {
        actor_ip = string!(original.source_ip)
        actor.ip = actor_ip
        allocation, allocation_error = get_enrichment_table_record(
          "ip_allocations",
          {"ip_address": actor_ip}
        )
        if allocation_error == null {
          actor.participant_id = string!(allocation.participant_id)
          actor.team_id = string!(allocation.team_id)
          actor.team_label = string!(allocation.team_label)
          metadata.attribution_status = "known"
          scope, scope_error = get_enrichment_table_record(
            "scope_assignments",
            {
              "source_ip": actor_ip,
              "enterprise": enterprise,
              "application": application,
              "active": "true"
            }
          )
          if scope_error == null && string!(scope.target_ip) == string!(application_record.ip_address) {
            verdict = "allowed"
            metadata.scope_status = "allowed"
          } else {
            verdict = "unknown"
            metadata.scope_status = "unknown"
          }
        } else {
          actor.team_label = "unknown"
          metadata.attribution_status = "unknown"
          metadata.scope_status = "unknown"
          verdict = "unknown"
        }
      } else {
        metadata.attribution_status = "not_applicable"
        metadata.scope_status = "not_applicable"
      }
      if exists(original.user_id) { actor.user_id = string!(original.user_id) }

      target = {
        "enterprise": enterprise,
        "application": application,
        "namespace": namespace,
        "asset": asset,
        "ip": string!(application_record.ip_address)
      }
      if exists(original.target_id) { target.target_id = string!(original.target_id) }

      http = {}
      if exists(original.method) { http.method = string!(original.method) }
      if exists(original.path) { http.path = string!(original.path) }
      if exists(original.status) { http.status = int!(original.status) }
      if exists(original.action) { http.action = string!(original.action) }

      normalized = {
        "schema_version": "2.0",
        "catalogue_version": 1,
        "stream": "telemetry",
        "ts": ts,
        "received_ts": now(),
        "enterprise": enterprise,
        "application": application,
        "namespace": namespace,
        "asset": asset,
        "source": "application",
        "raw_event": raw_event,
        "event_type": event_type,
        "severity": severity,
        "target": target,
        "outcome": outcome,
        "verdict": verdict,
        "metadata": metadata
      }

      if length(keys(actor)) > 0 { normalized.actor = actor }
      if length(keys(http)) > 0 { normalized.http = http }
      if exists(original.request_id) { normalized.request_id = string!(original.request_id) }
      if exists(original.trace_id) { normalized.trace_id = string!(original.trace_id) }
      if string!(mapping.attack_mapping) != "" {
        normalized.attack_mapping = split(string!(mapping.attack_mapping), "|")
      }

      identity_hash = sha2(encode_json(original), variant: "SHA-256")
      normalized.event_id = "evt_" + identity_hash
      normalized.integrity_hash = "sha256:" + sha2(
        encode_json(normalized),
        variant: "SHA-256"
      )
      . = normalized

  normalized_sources:
    type: remap
    inputs:
      - split_inputs.source
    drop_on_error: true
    reroute_dropped: true
    source: |
      source_hint = string!(.source_hint)
      raw_message = string!(.raw_message)
      original = {}

      if source_hint == "netflow" {
        flow = object!(parse_json!(raw_message))
        original = {
          "schema_version": "2.0",
          "ts": format_timestamp!(.observed_ts, format: "%+"),
          "source": "network",
          "event": "netflow_record",
          "asset": "gateway/netflow",
          "outcome": "success",
          "verdict": "unknown",
          "source_ip": string!(flow.src_addr),
          "destination_ip": string!(flow.dst_addr),
          "src_port": int!(flow.src_port),
          "dst_port": int!(flow.dst_port),
          "protocol": string!(flow.proto),
          "bytes": int!(flow.bytes),
          "packets": int!(flow.packets),
          "sequence_num": int!(flow.sequence_num),
          "sampler_address": string!(flow.sampler_address)
        }
      } else {
        original = object!(parse_json!(raw_message))
      }

      allowed_fields = [
        "schema_version", "ts", "source", "event", "asset", "outcome",
        "verdict", "severity", "enterprise", "application", "namespace",
        "request_id", "trace_id", "source_ip", "destination_ip", "src_port",
        "dst_port", "protocol", "bytes", "packets", "rule_id", "method",
        "path", "status", "action", "signature_id", "signature", "category",
        "ids_action", "reason", "kind", "restart_count", "sequence_num",
        "sampler_address"
      ]
      for_each(keys(original)) -> |_index, key| {
        assert!(includes(allowed_fields, key), "unrecognized source field")
      }

      assert_eq!(string!(original.schema_version), "2.0")
      source = string!(original.source)
      assert!(includes(["ingress", "network", "ids", "kubernetes", "host"], source))
      raw_event = string!(original.event)
      outcome = string!(original.outcome)
      verdict = string!(original.verdict)
      ts = parse_timestamp!(string!(original.ts), format: "%+")
      assert!(includes(["success", "failure", "denied", "error", "unknown"], outcome))
      assert!(includes(["allowed", "refused", "not_applicable", "unknown"], verdict))

      mapping = get_enrichment_table_record!(
        "event_catalogue",
        {"source": source, "event": raw_event}
      )
      event_type = string!(mapping.event_type)
      severity = if exists(original.severity) {
        string!(original.severity)
      } else {
        string!(mapping.severity)
      }
      assert!(includes(["low", "medium", "high", "critical"], severity))

      destination_ip = if exists(original.destination_ip) {
        string!(original.destination_ip)
      } else {
        namespace_hint = string!(original.namespace)
        hinted_application = get_enrichment_table_record!(
          "applications",
          {"namespace": namespace_hint}
        )
        string!(hinted_application.ip_address)
      }
      application_record = get_enrichment_table_record!(
        "applications",
        {"ip_address": destination_ip}
      )
      enterprise = string!(application_record.enterprise)
      application = string!(application_record.application)
      namespace = string!(application_record.namespace)
      target_asset = string!(application_record.asset)

      if exists(original.enterprise) { assert_eq!(string!(original.enterprise), enterprise) }
      if exists(original.application) { assert_eq!(string!(original.application), application) }
      if exists(original.namespace) { assert_eq!(string!(original.namespace), namespace) }

      actor = {}
      metadata = {"transport": source_hint}
      metadata.environment = get_env_var("JENGASEC_V2_TELEMETRY_ENVIRONMENT") ?? "rehearsal"
      assert!(includes(["live", "validation", "rehearsal"], metadata.environment))
      if exists(original.source_ip) {
        actor_ip = string!(original.source_ip)
        actor.ip = actor_ip
        allocation, allocation_error = get_enrichment_table_record(
          "ip_allocations",
          {"ip_address": actor_ip}
        )
        if allocation_error == null {
          actor.participant_id = string!(allocation.participant_id)
          actor.team_id = string!(allocation.team_id)
          actor.team_label = string!(allocation.team_label)
          metadata.attribution_status = "known"
          if includes(["ingress", "network", "ids"], source) {
            scope, scope_error = get_enrichment_table_record(
              "scope_assignments",
              {
                "source_ip": actor_ip,
                "enterprise": enterprise,
                "application": application,
                "active": "true"
              }
            )
            if scope_error == null && string!(scope.target_ip) == destination_ip {
              assert!(verdict != "refused", "gateway verdict contradicts active scope")
              verdict = "allowed"
              metadata.scope_status = "allowed"
            } else if includes(["firewall_refused", "ingress_scope_refused"], raw_event) && verdict == "refused" {
              metadata.scope_status = "refused"
            } else {
              verdict = "unknown"
              metadata.scope_status = "unknown"
            }
          } else {
            metadata.scope_status = "not_applicable"
          }
        } else {
          actor.team_label = "unknown"
          metadata.attribution_status = "unknown"
          if includes(["ingress", "network", "ids"], source) {
            verdict = "unknown"
            metadata.scope_status = "unknown"
          } else {
            metadata.scope_status = "not_applicable"
          }
        }
      } else {
        metadata.attribution_status = "unknown"
        metadata.scope_status = "unknown"
        if includes(["ingress", "network", "ids"], source) { verdict = "unknown" }
      }

      target = {
        "ip": destination_ip,
        "enterprise": enterprise,
        "application": application,
        "namespace": namespace,
        "asset": target_asset
      }

      http = {}
      if exists(original.method) { http.method = string!(original.method) }
      if exists(original.path) { http.path = string!(original.path) }
      if exists(original.status) { http.status = int!(original.status) }
      if exists(original.action) { http.action = string!(original.action) }

      network = {}
      if exists(original.src_port) { network.src_port = int!(original.src_port) }
      if exists(original.dst_port) { network.dst_port = int!(original.dst_port) }
      if exists(original.protocol) { network.protocol = string!(original.protocol) }
      if exists(original.bytes) { network.bytes = int!(original.bytes) }
      if exists(original.packets) { network.packets = int!(original.packets) }
      if exists(original.rule_id) { network.rule_id = string!(original.rule_id) }

      ids = {}
      if exists(original.signature_id) { ids.signature_id = string!(original.signature_id) }
      if exists(original.signature) { ids.signature = string!(original.signature) }
      if exists(original.category) { ids.category = string!(original.category) }
      if exists(original.ids_action) { ids.action = string!(original.ids_action) }

      if exists(original.reason) { metadata.reason = string!(original.reason) }
      if exists(original.kind) { metadata.kind = string!(original.kind) }
      if exists(original.restart_count) { metadata.restart_count = int!(original.restart_count) }
      if exists(original.sequence_num) { metadata.sequence_num = int!(original.sequence_num) }
      if exists(original.sampler_address) {
        metadata.sampler_address = string!(original.sampler_address)
      }

      normalized = {
        "schema_version": "2.0",
        "catalogue_version": 1,
        "stream": "telemetry",
        "ts": ts,
        "received_ts": now(),
        "enterprise": enterprise,
        "application": application,
        "namespace": namespace,
        "asset": string!(original.asset),
        "source": source,
        "raw_event": raw_event,
        "event_type": event_type,
        "severity": severity,
        "target": target,
        "outcome": outcome,
        "verdict": verdict,
        "metadata": metadata
      }

      if length(keys(actor)) > 0 { normalized.actor = actor }
      if length(keys(http)) > 0 { normalized.http = http }
      if length(keys(network)) > 0 { normalized.network = network }
      if length(keys(ids)) > 0 { normalized.ids = ids }
      if exists(original.request_id) { normalized.request_id = string!(original.request_id) }
      if exists(original.trace_id) { normalized.trace_id = string!(original.trace_id) }
      if string!(mapping.attack_mapping) != "" {
        normalized.attack_mapping = split(string!(mapping.attack_mapping), "|")
      }

      identity_hash = sha2(encode_json(original), variant: "SHA-256")
      normalized.event_id = "evt_" + identity_hash
      normalized.integrity_hash = "sha256:" + sha2(
        encode_json(normalized),
        variant: "SHA-256"
      )
      . = normalized

  normalized_infrastructure:
    type: remap
    inputs:
      - split_inputs.infrastructure
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true
    source: |
      original = object!(parse_json!(string!(.raw_message)))
      assert!(length(string!(.raw_message)) <= 16384, "oversized infrastructure event")
      allowed = ["schema_version", "record_family", "environment", "source", "resource_id", "event_type", "source_event_id", "ts", "severity", "outcome", "resource", "attributes"]
      for_each(keys(original)) -> |_index, key| {
        assert!(includes(allowed, key), "unrecognized infrastructure field")
      }
      for_each(allowed) -> |_index, key| {
        value = get!(original, [key])
        assert!(!is_null(value), "missing infrastructure field")
      }
      assert_eq!(string!(original.schema_version), "infrastructure/1.0")
      assert_eq!(string!(original.record_family), "infrastructure_telemetry")
      assert!(includes(["live", "validation", "rehearsal"], string!(original.environment)))
      assert!(includes(["low", "medium", "high", "critical"], string!(original.severity)))
      assert!(includes(["success", "failure", "denied", "error", "unknown"], string!(original.outcome)))
      resource_id = string!(original.resource_id)
      assert!(match(resource_id, r'^[a-z][a-z0-9-]{0,31}$'))
      resource_ids = split(get_env_var("JENGASEC_INFRASTRUCTURE_RESOURCE_IDS") ?? "test-host", ",")
      assert!(includes(resource_ids, resource_id), "unregistered infrastructure resource")
      assert!(match(string!(original.source_event_id), r'^[a-f0-9]{64}$'))
      assert!(ends_with(string!(original.ts), "Z"), "infrastructure time must be UTC")
      parsed_ts = parse_timestamp!(string!(original.ts), format: "%+")
      resource = object!(original.resource)
      for_each(keys(resource)) -> |_index, key| {
        assert!(includes(["service", "cluster", "namespace", "kind", "name", "interface"], key))
        value = string!(get!(resource, [key]))
        if key == "service" {
          assert!(match(value, r'^[A-Za-z0-9][A-Za-z0-9_.@-]{0,127}$'))
        } else {
          assert!(match(value, r'^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,252}$'))
        }
        if includes(["kind", "interface"], key) { assert!(length(value) <= 64) }
        if key == "cluster" { assert!(includes(["red", "blue"], value)) }
      }
      event_type = string!(original.event_type)
      source = string!(original.source)
      attributes = object!(original.attributes)
      if event_type == "host.service_state" {
        assert_eq!(source, "host")
        allowed_attributes = ["state", "reason"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          assert!(includes(["active", "inactive", "failed", "activating", "deactivating", "reloading", "unknown"], string!(attributes.state)))
        if exists(attributes.reason) {
          assert!(includes(["started", "stopped", "failed", "changed", "reloaded"], string!(attributes.reason)))
        }
      } else if event_type == "host.auth_success" {
        assert_eq!(source, "host")
        allowed_attributes = ["mechanism", "peer_ip"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          assert!(includes(["password", "publickey", "pam", "sudo", "unknown"], string!(attributes.mechanism)))
        if exists(attributes.peer_ip) {
          assert!(is_ipv4(string!(attributes.peer_ip)) || is_ipv6(string!(attributes.peer_ip)))
        }
      } else if event_type == "host.auth_failure" {
        assert_eq!(source, "host")
        allowed_attributes = ["mechanism", "peer_ip"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          assert!(includes(["password", "publickey", "pam", "sudo", "unknown"], string!(attributes.mechanism)))
        if exists(attributes.peer_ip) {
          assert!(is_ipv4(string!(attributes.peer_ip)) || is_ipv6(string!(attributes.peer_ip)))
        }
      } else if event_type == "host.boot" {
        assert_eq!(source, "host")
        allowed_attributes = []
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
      } else if event_type == "kubernetes.event" {
        assert_eq!(source, "kubernetes")
        allowed_attributes = ["reason", "action", "count", "type"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          assert!(match(string!(attributes.reason), r'^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,63}$'))
        if exists(attributes.action) {
          assert!(match(string!(attributes.action), r'^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,63}$'))
        }
          value = int!(attributes.count)
          assert!(value >= 0 && value <= 9007199254740991)
          assert!(includes(["Normal", "Warning"], string!(attributes.type)))
      } else if event_type == "network.flow" {
        assert_eq!(source, "network")
        allowed_attributes = ["src_ip", "dst_ip", "src_port", "dst_port", "protocol", "bytes", "packets", "sampling_rate"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          assert!(is_ipv4(string!(attributes.src_ip)) || is_ipv6(string!(attributes.src_ip)))
          assert!(is_ipv4(string!(attributes.dst_ip)) || is_ipv6(string!(attributes.dst_ip)))
        if exists(attributes.src_port) {
          value = int!(attributes.src_port)
          assert!(value >= 0 && value <= 65535)
        }
        if exists(attributes.dst_port) {
          value = int!(attributes.dst_port)
          assert!(value >= 0 && value <= 65535)
        }
          assert!(includes(["TCP", "UDP", "ICMP", "ICMPV6", "SCTP", "GRE", "ESP", "AH", "OTHER"], string!(attributes.protocol)))
          value = int!(attributes.bytes)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.packets)
          assert!(value >= 0 && value <= 9007199254740991)
        if exists(attributes.sampling_rate) {
          value = int!(attributes.sampling_rate)
          assert!(value >= 1 && value <= 65535)
        }
      } else if event_type == "firewall.decision" {
        assert_eq!(source, "firewall")
        allowed_attributes = ["src_ip", "dst_ip", "src_port", "dst_port", "protocol", "verdict", "rule_id"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
        if exists(attributes.src_ip) {
          assert!(is_ipv4(string!(attributes.src_ip)) || is_ipv6(string!(attributes.src_ip)))
        }
        if exists(attributes.dst_ip) {
          assert!(is_ipv4(string!(attributes.dst_ip)) || is_ipv6(string!(attributes.dst_ip)))
        }
        if exists(attributes.src_port) {
          value = int!(attributes.src_port)
          assert!(value >= 0 && value <= 65535)
        }
        if exists(attributes.dst_port) {
          value = int!(attributes.dst_port)
          assert!(value >= 0 && value <= 65535)
        }
        if exists(attributes.protocol) {
          assert!(includes(["TCP", "UDP", "ICMP", "ICMPV6", "SCTP", "GRE", "ESP", "AH", "OTHER"], string!(attributes.protocol)))
        }
          assert!(includes(["allowed", "refused"], string!(attributes.verdict)))
          assert!(includes(["invalid", "peer_isolation", "protected_destination", "inbound_unsolicited", "allowed_assignment", "established_return", "default_deny", "assigned_policy"], string!(attributes.rule_id)))
      } else if event_type == "ids.alert" {
        assert_eq!(source, "ids")
        allowed_attributes = ["src_ip", "dst_ip", "src_port", "dst_port", "protocol", "signature_id", "signature_revision", "category", "ids_action"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
        if exists(attributes.src_ip) {
          assert!(is_ipv4(string!(attributes.src_ip)) || is_ipv6(string!(attributes.src_ip)))
        }
        if exists(attributes.dst_ip) {
          assert!(is_ipv4(string!(attributes.dst_ip)) || is_ipv6(string!(attributes.dst_ip)))
        }
        if exists(attributes.src_port) {
          value = int!(attributes.src_port)
          assert!(value >= 0 && value <= 65535)
        }
        if exists(attributes.dst_port) {
          value = int!(attributes.dst_port)
          assert!(value >= 0 && value <= 65535)
        }
        if exists(attributes.protocol) {
          assert!(includes(["TCP", "UDP", "ICMP", "ICMPV6", "SCTP", "GRE", "ESP", "AH", "OTHER"], string!(attributes.protocol)))
        }
          value = int!(attributes.signature_id)
          assert!(value >= 0 && value <= 9007199254740991)
        if exists(attributes.signature_revision) {
          value = int!(attributes.signature_revision)
          assert!(value >= 0 && value <= 9007199254740991)
        }
        if exists(attributes.category) {
          assert!(match(string!(attributes.category), r'^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,63}$'))
        }
          assert!(includes(["allowed", "blocked"], string!(attributes.ids_action)))
      } else if event_type == "collector.health" {
        assert_eq!(source, "collector")
        allowed_attributes = ["queue_events", "queue_bytes", "dropped_total", "delivered_total", "rejected_total", "collection_errors_total", "journal_lag_seconds"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          value = int!(attributes.queue_events)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.queue_bytes)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.dropped_total)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.delivered_total)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.rejected_total)
          assert!(value >= 0 && value <= 9007199254740991)
          value = int!(attributes.collection_errors_total)
          assert!(value >= 0 && value <= 9007199254740991)
        if exists(attributes.journal_lag_seconds) {
          value = int!(attributes.journal_lag_seconds)
          assert!(value >= 0 && value <= 9007199254740991)
        }
      } else if event_type == "collector.loss" {
        assert_eq!(source, "collector")
        allowed_attributes = ["count", "reason"]
        for_each(keys(attributes)) -> |_index, key| { assert!(includes(allowed_attributes, key)) }
          value = int!(attributes.count)
          assert!(value >= 0 && value <= 9007199254740991)
          assert!(includes(["queue_full", "journal_cursor_lost", "input_rotated", "oversized_record", "invalid_record"], string!(attributes.reason)))
      } else { abort }
      normalized = original
      normalized.ts = format_timestamp!(parsed_ts, format: "%Y-%m-%dT%H:%M:%S%.6fZ")
      normalized.received_ts = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.6fZ")
      normalized.event_id = "infra_" + sha2(resource_id + "\n" + string!(original.source_event_id), variant: "SHA-256")
      collector = if source == "kubernetes" { "otel-kubernetes/1.0" } else { "jengasec-event-agent/1.0" }
      transport = if string!(.source_hint) == "otlp" { "otlp" } else { "https" }
      normalized.provenance = {"collector": collector, "transport": transport}
      normalized.integrity_hash = "sha256:" + sha2(encode_json(normalized), variant: "SHA-256")
      . = normalized

  infrastructure_loki:
    type: remap
    inputs:
      - normalized_infrastructure
    source: |
      .timestamp = parse_timestamp!(string!(.ts), format: "%+")

  infrastructure_metric_fields:
    type: remap
    inputs:
      - normalized_infrastructure
    source: |
      .received_seconds = to_unix_timestamp(parse_timestamp!(string!(.received_ts), format: "%+"))

  infrastructure_metrics:
    type: log_to_metric
    inputs:
      - infrastructure_metric_fields
    metrics:
      - type: counter
        field: event_type
        name: jengasec_infrastructure_events_total
        increment_by_value: false
        kind: incremental
        tags:
          source: "{{ source }}"
          event_type: "{{ event_type }}"
          environment: "{{ environment }}"
      - type: gauge
        field: received_seconds
        name: jengasec_infrastructure_last_event_timestamp_seconds
        tags:
          source: "{{ source }}"
          resource_id: "{{ resource_id }}"
          environment: "{{ environment }}"

  attribution_metrics:
    type: log_to_metric
    inputs:
      - normalized_application
      - normalized_sources
    metrics:
      - type: counter
        field: metadata.attribution_status
        name: jengasec_attribution_events_total
        increment_by_value: false
        kind: incremental
        tags:
          environment: "{{ metadata.environment }}"
          source: "{{ source }}"
          status: "{{ metadata.attribution_status }}"
      - type: counter
        field: metadata.scope_status
        name: jengasec_scope_events_total
        increment_by_value: false
        kind: incremental
        tags:
          environment: "{{ metadata.environment }}"
          source: "{{ source }}"
          status: "{{ metadata.scope_status }}"

  quarantine_metrics:
    type: log_to_metric
    inputs:
      - quarantine_sensitive
      - quarantine_invalid
    metrics:
      - type: counter
        field: reason
        name: jengasec_contract_rejections_total
        increment_by_value: false
        kind: incremental
        tags:
          reason: "{{ reason }}"
          source: "{{ source }}"

  sanitized_website_feed:
    type: remap
    inputs:
      - normalized_application
      - normalized_sources
    source: |
      . = {
        "schema_version": "1.0",
        "event_id": .event_id,
        "ts": .ts,
        "enterprise": .enterprise,
        "application": .application,
        "event_type": .event_type,
        "severity": .severity,
        "outcome": .outcome,
        "verdict": .verdict
      }

  quarantine_sensitive:
    type: remap
    inputs:
      - reject_sensitive.dropped
    source: |
      raw_message = to_string(.raw_message) ?? ""
      . = {
        "ts": now(),
        "source": to_string(.source_hint) ?? "unknown",
        "reason": "sensitive_field",
        "payload_hash": "sha256:" + sha2(raw_message, variant: "SHA-256")
      }

  quarantine_invalid:
    type: remap
    inputs:
      - normalized_application.dropped
      - normalized_sources.dropped
      - normalized_infrastructure.dropped
      - split_inputs._unmatched
    source: |
      raw_message = to_string(.raw_message) ?? ""
      . = {
        "ts": now(),
        "source": to_string(.source_hint) ?? "unknown",
        "reason": "contract_or_catalogue_rejected",
        "payload_hash": "sha256:" + sha2(raw_message, variant: "SHA-256")
      }

sinks:
  loki_application:
    type: loki
    inputs:
      - normalized_application
      - normalized_sources
    endpoint: http://loki:3100
    tenant_id: "application-{{ namespace }}"
    healthcheck:
      enabled: false
    labels:
      environment: "{{ metadata.environment }}"
      enterprise: "{{ enterprise }}"
      application: "{{ application }}"
      namespace: "{{ namespace }}"
      source: "{{ source }}"
      event_type: "{{ event_type }}"
      severity: "{{ severity }}"
    encoding:
      codec: json
    batch:
      timeout_secs: 1

  loki_staff:
    type: loki
    inputs:
      - normalized_application
      - normalized_sources
    endpoint: http://loki:3100
    tenant_id: staff
    healthcheck:
      enabled: false
    labels:
      environment: "{{ metadata.environment }}"
      enterprise: "{{ enterprise }}"
      application: "{{ application }}"
      namespace: "{{ namespace }}"
      source: "{{ source }}"
      event_type: "{{ event_type }}"
      severity: "{{ severity }}"
    encoding:
      codec: json
    batch:
      timeout_secs: 1

  loki_infrastructure:
    type: loki
    inputs:
      - infrastructure_loki
    endpoint: http://loki:3100
    tenant_id: staff
    healthcheck:
      enabled: false
    labels:
      record_family: "{{ record_family }}"
      environment: "{{ environment }}"
      source: "{{ source }}"
      resource_id: "{{ resource_id }}"
      event_type: "{{ event_type }}"
      severity: "{{ severity }}"
    encoding:
      codec: json
      except_fields:
        - timestamp
    batch:
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 536870912
      when_full: block

  quarantine:
    type: file
    inputs:
      - quarantine_sensitive
      - quarantine_invalid
    path: /var/lib/vector/quarantine/events.jsonl
    encoding:
      codec: json
    framing:
      method: newline_delimited

  prometheus_exporter:
    type: prometheus_exporter
    inputs:
      - vector_metrics
      - attribution_metrics
      - quarantine_metrics
      - infrastructure_metrics
    address: 0.0.0.0:9598

  website_feed_publisher:
    type: http
    inputs:
      - sanitized_website_feed
    uri: __WEBSITE_FEED_URL__
    method: post
    healthcheck:
      enabled: false
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_events: 1
      timeout_secs: 1
    buffer:
      type: memory
      max_events: 500
      when_full: drop_newest

  ai_telemetry_handoff:
    type: file
    inputs:
      - normalized_application
      - normalized_sources
    path: /var/lib/vector/ai-handoff/telemetry-%Y-%m-%d.ndjson
    encoding:
      codec: json
    framing:
      method: newline_delimited
