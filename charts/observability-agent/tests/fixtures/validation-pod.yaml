apiVersion: v1
kind: Pod
metadata:
  name: observability-validation-watch
  namespace: jengasec-observability
  labels:
    app.kubernetes.io/component: observability-validation
    jengasec.io/environment: validation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: validation
      image: rancher/mirrored-pause:3.10.2
      imagePullPolicy: IfNotPresent
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
