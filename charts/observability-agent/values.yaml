namespace: jengasec-observability

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.137.0
  pullPolicy: IfNotPresent

obs:
  environment: rehearsal
  cluster: red
  resourceId: cluster-red
  eventsEnabled: false
  otlpEndpoint: ""
  prometheusRemoteWriteUrl: ""
  tls:
    insecure: false
    secretName: observability-client-tls

persistence:
  storageClassName: ""
  size: 2Gi

clusterCollector:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
