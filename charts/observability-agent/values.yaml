namespace: jengasec-observability

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.137.0
  pullPolicy: IfNotPresent

obs:
  otlpEndpoint: ""
  prometheusRemoteWriteUrl: ""
  tls:
    insecure: false

logAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

clusterCollector:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
