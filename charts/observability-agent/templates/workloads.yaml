apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-cluster-collector
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-cluster-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-cluster-collector
        app.kubernetes.io/part-of: jengasec
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: observability-agent
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/cluster.yaml"]
          env:
            - name: OBS_ENVIRONMENT
              value: {{ .Values.obs.environment | quote }}
            - name: OBS_CLUSTER
              value: {{ .Values.obs.cluster | quote }}
            - name: OBS_RESOURCE_ID
              value: {{ .Values.obs.resourceId | quote }}
            - name: OBS_OTLP_ENDPOINT
              value: {{ .Values.obs.otlpEndpoint | quote }}
            - name: OBS_OTLP_INSECURE
              value: {{ .Values.obs.tls.insecure | quote }}
            - name: OBS_PROMETHEUS_REMOTE_WRITE_URL
              value: {{ .Values.obs.prometheusRemoteWriteUrl | quote }}
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.clusterCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/cluster.yaml
              subPath: cluster.yaml
              readOnly: true
            - name: state
              mountPath: /var/lib/otelcol
            {{- if not .Values.obs.tls.insecure }}
            - name: tls
              mountPath: /etc/otelcol-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: observability-agent-config
        - name: state
          persistentVolumeClaim:
            claimName: observability-cluster-state
        {{- if not .Values.obs.tls.insecure }}
        - name: tls
          secret:
            secretName: {{ .Values.obs.tls.secretName }}
            defaultMode: 0440
        {{- end }}
