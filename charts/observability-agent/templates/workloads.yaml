apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: observability-log-agent
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-log-agent
        app.kubernetes.io/part-of: jengasec
    spec:
      serviceAccountName: observability-agent
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/logs.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OBS_OTLP_ENDPOINT
              value: {{ .Values.obs.otlpEndpoint | quote }}
            - name: OBS_OTLP_INSECURE
              value: {{ .Values.obs.tls.insecure | quote }}
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.logAgent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/logs.yaml
              subPath: logs.yaml
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-agent-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-cluster-collector
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-cluster-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-cluster-collector
        app.kubernetes.io/part-of: jengasec
    spec:
      serviceAccountName: observability-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/cluster.yaml"]
          env:
            - name: OBS_OTLP_ENDPOINT
              value: {{ .Values.obs.otlpEndpoint | quote }}
            - name: OBS_OTLP_INSECURE
              value: {{ .Values.obs.tls.insecure | quote }}
            - name: OBS_PROMETHEUS_REMOTE_WRITE_URL
              value: {{ .Values.obs.prometheusRemoteWriteUrl | quote }}
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: {path: /, port: health}
          livenessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.clusterCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/cluster.yaml
              subPath: cluster.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-agent-config
