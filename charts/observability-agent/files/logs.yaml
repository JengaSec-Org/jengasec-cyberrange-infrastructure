extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  filelog/application:
    include:
      - /var/log/pods/jengasec-ent-a-app0[1-9]_*/app/*.log
      - /var/log/pods/jengasec-ent-b-app0[1-9]_*/app/*.log
    start_at: end
    include_file_path: true
    operators:
      - id: container-parser
        type: container

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100
  k8sattributes:
    auth_type: serviceAccount
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
  batch:
    timeout: 1s

exporters:
  otlp/obs:
    endpoint: ${env:OBS_OTLP_ENDPOINT}
    tls:
      insecure: ${env:OBS_OTLP_INSECURE}
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 2048

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [filelog/application]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [otlp/obs]
