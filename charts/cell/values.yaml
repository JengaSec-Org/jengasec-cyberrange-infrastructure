# One application instance. See contracts/cell-template.md.
namespace: jengasec-ent-a-app01
enterprise: ENT-A
application: APP01
reservedIP: 10.108.0.11
domain: range.example

image:
  repository: ""            # set by the deploy pipeline
  tag: "latest"

app:
  port: 8080
  healthPath: /healthz
  replicas: 1

quota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 3Gi
  pvcs: "2"

database:
  enabled: true
  image: postgres:16.15-bookworm
  storage: 5Gi
  name: appdb
  user: appuser

ingress:
  enabled: true
  # Owner Blue team, active Red assignments, and staff; applied by make-scope.py.
  # Applied by scripts/make-scope.py from contracts/scope-assignments.csv.
  allowedRanges:
    - 10.63.0.0/24
  rateLimit:
    average: 50
    burst: 100

preview:
  enabled: false            # true only during the build stage
  # htpasswd-style value created by the accounts script, stored as a Secret
  secretName: ""
