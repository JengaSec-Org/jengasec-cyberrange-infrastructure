# One cell. Everything a team gets, and nothing else. See contracts/cell-template.md.
cell: app-00                # app-01 … app-14
enterprise: zawadi-bank     # zawadi-bank | afya-health
domain: range.example       # from contracts/address-plan.md

image:
  repository: ""            # set by the deploy pipeline
  tag: "latest"

app:
  port: 8080
  healthPath: /healthz
  replicas: 1

quota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 3Gi
  pvcs: "2"

database:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  name: appdb
  user: appuser

ingress:
  enabled: true
  # Addresses allowed to reach this cell: its Blue team, its two Red teams, staff.
  # Generated by scripts/make-allowlists from contracts/scope-assignments.csv.
  allowedRanges:
    - 10.63.0.0/24
  rateLimit:
    average: 50
    burst: 100

preview:
  enabled: false            # true only during the build stage
  # htpasswd-style value created by the accounts script, stored as a Secret
  secretName: ""
