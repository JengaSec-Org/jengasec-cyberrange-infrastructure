# One application instance. See contracts/cell-template.md.
namespace: jengasec-ent-a-app01
enterprise: ENT-A
application: APP01
reservedIP: 10.108.0.11
domain: range.example

image:
  repository: ""            # set by the deploy pipeline
  tag: "latest"

app:
  port: 8080
  healthPath: /healthz
  replicas: 1

quota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 3Gi
  pvcs: "2"

database:
  enabled: true
  image: >-
    postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
  storage: 5Gi
  name: appdb
  user: appuser

ingress:
  enabled: true
  # Addresses allowed to reach this application: its Blue team, three Red teams and staff.
  # Generated by scripts/make-allowlists from contracts/scope-assignments.csv.
  allowedRanges:
    - 10.63.0.0/24
  rateLimit:
    average: 50
    burst: 100

preview:
  enabled: false            # true only during the build stage
  # htpasswd-style value created by the accounts script, stored as a Secret
  secretName: ""
