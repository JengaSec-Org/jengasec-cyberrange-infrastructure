{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: application-scope
  namespace: {{ .Values.namespace }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.ingress.allowedRanges }}
      - {{ . }}
      {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: application-ratelimit
  namespace: {{ .Values.namespace }}
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.average }}
    burst: {{ .Values.ingress.rateLimit.burst }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{ .Values.namespace }}-application-scope@kubernetescrd,{{ .Values.namespace }}-application-ratelimit@kubernetescrd
spec:
  rules:
    - host: {{ .Values.enterprise | lower }}-{{ .Values.application | lower }}.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port: { number: 80 }
  tls:
    - hosts: ["{{ .Values.enterprise | lower }}-{{ .Values.application | lower }}.{{ .Values.domain }}"]
      secretName: range-wildcard-tls
{{- end }}
