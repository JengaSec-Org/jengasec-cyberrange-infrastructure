apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: {{ .Values.cell }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: {{ .Values.cell }}
rules:
  - apiGroups: ["apps", ""]
    resources: ["deployments", "pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: {{ .Values.cell }}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: {{ .Values.cell }}
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
