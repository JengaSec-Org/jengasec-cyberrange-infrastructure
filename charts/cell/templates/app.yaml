{{- if .Values.image.repository }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cell.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector: { matchLabels: { app: app } }
  template:
    metadata:
      labels:
        app: app
        {{- include "cell.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.app.port | quote }}
    spec:
      serviceAccountName: application
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: {{ .Values.app.port }} }]
          envFrom:
            - secretRef: { name: db-credentials }
          env:
            - { name: JENGASEC_ENTERPRISE, value: {{ .Values.enterprise | quote }} }
            - { name: JENGASEC_APPLICATION, value: {{ .Values.application | quote }} }
            - { name: JENGASEC_NAMESPACE, value: {{ .Values.namespace | quote }} }
          readinessProbe:
            httpGet: { path: {{ .Values.app.healthPath }}, port: {{ .Values.app.port }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.app.healthPath }}, port: {{ .Values.app.port }} }
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ .Values.namespace }}
  annotations:
    metallb.io/loadBalancerIPs: {{ .Values.reservedIP | quote }}
spec:
  type: LoadBalancer
  selector: { app: app }
  ports: [{ port: 80, targetPort: {{ .Values.app.port }} }]
{{- end }}
