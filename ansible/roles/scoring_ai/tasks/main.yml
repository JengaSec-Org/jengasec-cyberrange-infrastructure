---
- name: Require the exact component and private runtime configuration
  ansible.builtin.assert:
    that:
      - scoring_ai_mode in ['gateway', 'actuator', 'probe']
      - scoring_ai_config | length > 0
      - scoring_ai_mode == 'probe' or scoring_ai_tokens.principals | default([]) | length > 0
      - scoring_ai_mode == 'probe' or scoring_ai_config.identity_file is defined
      - scoring_ai_mode == 'probe' or scoring_ai_config.competition_networks | default([]) | length > 0
      - scoring_ai_mode == 'probe' or scoring_ai_config.protected_networks | default([]) | length > 0
      - scoring_ai_mode != 'gateway' or scoring_ai_config.actuator_command | default([]) | length > 0
      - scoring_ai_mode != 'gateway' or scoring_ai_config.cursor_secret | default('') | length >= 32
      - scoring_ai_mode == 'probe' or scoring_ai_config.tokens_file == scoring_ai_config_root ~ '/tokens.json'
      - scoring_ai_mode == 'probe' or scoring_ai_config.state_file is match('^' ~ scoring_ai_state_root ~ '/')
      - scoring_ai_mode == 'actuator' or scoring_ai_config.evidence_directory is match('^' ~ scoring_ai_state_root ~ '/')
      - scoring_ai_mode != 'actuator' or scoring_ai_config.verifier_command | default([]) | length > 0
      - scoring_ai_mode != 'probe' or scoring_ai_config.checks | default([]) | length > 0
  no_log: true

- name: Verify the existing Python runtime
  ansible.builtin.command:
    argv: ["{{ scoring_ai_python }}", -c, "import sys; assert sys.version_info >= (3, 10)"]
  changed_when: false

- name: Create an unprivileged account for the HTTP gateway
  ansible.builtin.user:
    name: "{{ scoring_ai_gateway_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: "{{ scoring_ai_gateway_groups }}"
    append: true
  when: scoring_ai_mode == 'gateway'

- name: Select component state owner
  ansible.builtin.set_fact:
    scoring_ai_owner: "{{ scoring_ai_gateway_user if scoring_ai_mode == 'gateway' else 'root' }}"

- name: Create code and private runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ scoring_ai_install_root }}", owner: root, mode: '0755'}
    - {path: "{{ scoring_ai_install_root }}/scoring_ai", owner: root, mode: '0755'}
    - {path: "{{ scoring_ai_config_root }}", owner: "{{ scoring_ai_owner }}", mode: '0700'}
    - {path: "{{ scoring_ai_state_root }}", owner: "{{ scoring_ai_owner }}", mode: '0700'}
    - {path: "{{ scoring_ai_state_root }}/evidence", owner: "{{ scoring_ai_owner }}", mode: '0700'}

- name: Install dependency-free AI service source
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ scoring_ai_install_root }}/scoring_ai/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../scripts/scoring_ai/*.py') }}"
  notify: Restart the AI gateway

- name: Install AI component entrypoint
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/run-scoring-ai.py"
    dest: "{{ scoring_ai_install_root }}/run-scoring-ai.py"
    owner: root
    group: root
    mode: '0755'
  notify: Restart the AI gateway

- name: Install private component configuration
  ansible.builtin.copy:
    content: "{{ scoring_ai_config | to_nice_json }}"
    dest: "{{ scoring_ai_config_root }}/config.json"
    owner: "{{ scoring_ai_owner }}"
    group: "{{ scoring_ai_owner }}"
    mode: '0600'
  no_log: true
  notify: Restart the AI gateway

- name: Install private producer token hashes
  ansible.builtin.copy:
    content: "{{ scoring_ai_tokens | to_nice_json }}"
    dest: "{{ scoring_ai_config_root }}/tokens.json"
    owner: "{{ scoring_ai_owner }}"
    group: "{{ scoring_ai_owner }}"
    mode: '0600'
  no_log: true
  when: scoring_ai_mode != 'probe'

- name: Install the bounded HTTP gateway unit
  ansible.builtin.template:
    src: jengasec-ai.service.j2
    dest: /etc/systemd/system/jengasec-ai.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart the AI gateway
  when: scoring_ai_mode == 'gateway'

- name: Check gateway identity and private configuration without executing actions
  ansible.builtin.command:
    argv:
      - "{{ scoring_ai_python }}"
      - "{{ scoring_ai_install_root }}/run-scoring-ai.py"
      - check
      - --config
      - "{{ scoring_ai_config_root }}/config.json"
  become_user: "{{ scoring_ai_gateway_user }}"
  changed_when: false
  when: scoring_ai_mode == 'gateway' and scoring_ai_start | bool

- name: Write the location snippet for the existing TLS virtual host
  ansible.builtin.template:
    src: nginx-location.conf.j2
    dest: "{{ scoring_ai_nginx_snippet }}"
    owner: root
    group: root
    mode: '0644'
  when: scoring_ai_mode == 'gateway'

- name: Start the gateway only in the approved rollout
  ansible.builtin.systemd:
    name: jengasec-ai.service
    enabled: true
    state: started
    daemon_reload: true
  when: scoring_ai_mode == 'gateway' and scoring_ai_start | bool
