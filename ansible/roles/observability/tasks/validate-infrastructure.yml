---
- name: Check the live Prometheus configuration with its runtime image
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - run
      - --rm
      - --pull=never
      - --network=none
      - --entrypoint=/bin/promtool
      - --volume
      - "{{ obs_infrastructure_config_root }}:/etc/jengasec-infrastructure:ro"
      - prom/prometheus:v3.15.0
      - check
      - config
      - /etc/jengasec-infrastructure/prometheus.yml
  changed_when: false

- name: Check the telemetry TLS receiver with its runtime image
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - run
      - --rm
      - --pull=never
      - --network=none
      - --add-host=prometheus:127.0.0.1
      - --add-host=vector:127.0.0.1
      - --add-host=loki:127.0.0.1
      - --entrypoint=nginx
      - --volume
      - "{{ obs_infrastructure_config_root }}:/etc/jengasec-infrastructure:ro"
      - nginx:1.28.0-alpine3.21
      - -t
      - -c
      - /etc/jengasec-infrastructure/nginx.conf
  changed_when: false

- name: Check the live Vector configuration with its runtime image
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - jengasec-observability
      - --env-file
      - "{{ obs_config_root }}/observability.env"
      - --file
      - "{{ obs_install_root }}/releases/{{ obs_release_id }}/observability/compose.production.yaml"
      - run
      - --rm
      - --no-deps
      - vector
      - validate
      - --skip-healthchecks
      - /etc/vector/generated/vector.yaml
  changed_when: false
