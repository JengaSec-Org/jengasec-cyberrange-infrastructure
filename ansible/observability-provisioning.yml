---
- name: Install one native provisioning observation source or cache
  hosts: observability_nodes
  become: true
  serial: 1
  pre_tasks:
    - name: Require an explicitly selected host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: Select one source or cache host with the private inventory
        quiet: true
  roles:
    - observability_provisioning
