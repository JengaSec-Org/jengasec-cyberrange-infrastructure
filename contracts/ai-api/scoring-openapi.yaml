openapi: 3.1.0
info:
  title: JengaSec Scoring Observations and Actions API
  version: 2.0.0
  description: >-
    Authenticated observations and real bounded competition actions. The website
    owns scores. This additive protocol is served by the AIC facade under
    /api/v1/scoring when SCORING_MODE is enabled. The separate v1.3 contract
    retains its existing read routes. Teams supply their own AI competitors.
    Callers must inspect action state after 202. No missing case, event time,
    epoch or sequence is inferred from legacy requests.
servers:
  - url: /api/v1/scoring
security:
  - cellToken: []
x-owners: [AI, Observability, Platform, Scoring]
x-facade: >-
  The AIC service must explicitly enable SCORING_MODE. It forwards only this
  protocol's GET and POST paths to a fixed loopback gateway, without replacing
  bearer credentials or inferring provenance. Request bodies are bounded to
  64 KiB, response bodies to 1 MiB, backend response headers to 16 KiB and active
  backend connections to 16. The total backend deadline defaults to 35 seconds
  and cannot exceed 60. Oversized pages return 413 and may be retried with a
  smaller limit. Redirects are rejected and unavailable backends return 503.
  No failure selects legacy shadow actions or heuristic scoring as a fallback.
x-identity: >-
  Gateway and executor independently read scoring-identity/2.0. Snapshots expire
  within 120 seconds. Targets require canonical ownership, verified frozen
  digest, exact IP/protocol/port, allocated traffic source and active action
  scope. source_cidr identifies traffic that may be blocked, not the caller's
  address. Unknown, stale or overlapping identity prevents execution.
x-execution: >-
  block-ip installs only a timed drop for the source/target/protocol/port tuple
  in a dedicated nft table. It does not alter the provisioning guard chain.
  Limits are one active block per team/target, five new actions per minute and
  thirty per hour. Requested TTL is 10 to 60 seconds, shortened by assignment
  and competition expiry. The kernel enforces expiry if workers stop. A trusted
  probe must show functional traffic from both selected and control sources
  before execution, then failure only from the selected source afterward.
  Failed verification, interrupted work, stale authority and kill switch cause
  reversal. Recovery is checked before a reverted receipt is issued. Missing
  rules after a rebuild are not silently replayed.
x-snapshot-and-revert: >-
  snapshot-evidence archives selected telemetry evidence only. It is not a VM
  snapshot, an application snapshot or workload restoration. Revert removes
  this actuator's block-ip lease and verifies functional recovery. It does not
  restore workloads or undo arbitrary alerts or evidence archives. Session,
  account, rate-limit, isolation and workload-restoration actuators are unsupported.
x-privacy: >-
  No tokens, prompts, raw response bodies or free-text model rationale are
  stored. Decisions use rationale codes and typed evidence IDs. Reads expose
  only assigned targets. Telemetry is an ai-telemetry/1.0 safe projection with
  source_schema_version, source_integrity_hash and its own integrity_hash.
  Infrastructure references remain staff-only. SHA-256 detects changed content;
  authenticated producers and transport establish origin, not the hash itself.
x-operations: >-
  scripts/run-scoring-ai.py serve binds only loopback at /api/v1. The AIC
  public facade forwards /api/v1/scoring to that fixed private backend while
  preserving the original bearer and structured request. Missing or failed
  backends reject requests; there is no shadow fallback. The actuator subcommand runs via a fixed SSH forced command and reads
  credentials from stdin, its own token file and its own fresh snapshot. The
  probe subcommand runs on a trusted host or namespace owning the selected and
  control source IPs. It runs source-bound HTTP checks against private frozen
  configuration, never participant-supplied commands or URLs. Probe results,
  assertion inputs and content hashes travel inside action receipts. Deployment
  needs reviewed host keys, narrow SSH access, fresh identity delivery, existing
  Vector spool read access, private state and evidence storage. Source
  installation does not install accounts, keys or mutate a firewall.
x-state: >-
  SQLite stores leases, producer sequences and delivery receipts, never marks.
  Each store is bounded to 64 MiB and 50000 receipts and rejects new work when
  full. Gateway reconnects import actuator receipts without changing IDs and
  acknowledge the durable replica. Operator export acknowledgement removes
  delivered journal rows while preserving current protocol state and action
  retry keys. Older cursors fail explicitly. Operators retain complete proofs
  before acknowledgement. Evidence archives and probe evidence each have a 64 MiB
  ceiling and require owner-managed archival cleanup. This does not extend raw
  telemetry retention.
x-platform-bridge: >-
  scoring_ai.platform_bridge.PlatformBridge reads operator receipt pages,
  validates their hashes and competition, retains complete proof through the
  collector callback, and queues deterministic UUID receipts using each
  configured platform producer. Only after all queue writes and the page cursor
  are durable may its acknowledgement callback call /receipts/ack. Unscheduled
  activity is explicitly audit-only, retained without inventing a scenario.
  Missing mappings for real scoring cases hold the page cursor. Source health
  starts at the first actual observation; two registered-epoch sequence reports
  describe delivery coverage and cumulative gap_count, not inferred app uptime.
components:
  securitySchemes:
    cellToken:
      type: http
      scheme: bearer
      description: >-
        A random per-producer token, bound to canonical team, cell, producer kind
        and epoch. An owner-only token file stores SHA-256 hashes. Competitors
        cannot use observer or operator grants. Requests are limited to 120/min.
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 2048}
      description: Opaque cursor bound to the team and endpoint.
    ActionId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^aia_[a-f0-9]{64}$'}
  schemas:
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [family, id]
      properties:
        family: {enum: [application, infrastructure, ai, scenario]}
        id: {type: string, maxLength: 128}
      description: >-
        evt_ IDs are application evidence, infra_ staff infrastructure, air_ AI,
        and scenario IDs are platform-issued. Families cannot be interchanged.
    Receipt:
      type: object
      required: [schema_version, receipt_id, source_id, sequence, kind, occurred_at,
                 received_at, competition, team_id, target_id, assignment_id,
                 assignment_revision, case_id, payload, integrity_hash]
      properties:
        schema_version: {const: ai-receipt/1.0}
        receipt_id: {type: string, pattern: '^air_[a-f0-9]{64}$'}
        source_id: {type: string, maxLength: 128}
        sequence: {type: integer, minimum: 1}
        kind: {enum: [action, decision, source_health, runtime_check]}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        competition: {type: [integer, 'null']}
        team_id: {type: string}
        target_id: {type: [string, 'null']}
        assignment_id: {type: [string, 'null']}
        assignment_revision: {type: [integer, 'null']}
        case_id: {type: [string, 'null']}
        payload: {type: object}
        integrity_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      description: >-
        Source sequence is immutable; export cursors are separate. Hashes use
        sorted-key compact ASCII JSON. receipt_id hashes the body without ID or
        integrity_hash; integrity_hash includes the ID. Rejections have null
        assignment fields and are not verified scoring facts.
    Observation:
      type: object
      required: [epoch, source_sequence, occurred_at, target_id, case_id]
      properties:
        epoch: {type: string, maxLength: 128}
        source_sequence: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        target_id: {type: string, maxLength: 128}
        case_id: {type: string, maxLength: 128}
      description: >-
        Token configuration fixes epoch. Sequence gaps are retained; stale and
        conflicting sequences fail. Identical latest retries are idempotent.
        Delivery may be at most 120 seconds old or two seconds in the future.
    Decision:
      allOf:
        - {$ref: '#/components/schemas/Observation'}
        - type: object
          required: [classification, incident_id, rationale_code, evidence_refs,
                     action_id, clock_uncertainty_seconds]
          properties:
            classification: {enum: [attack, legitimate, abstain]}
            incident_id: {type: string, maxLength: 128}
            rationale_code:
              enum: [signature_match, model_anomaly, correlated_activity,
                     known_legitimate, insufficient_evidence, policy_response]
            evidence_refs:
              type: array
              maxItems: 32
              items: {$ref: '#/components/schemas/EvidenceRef'}
            action_id: {type: [string, 'null'], pattern: '^aia_[a-f0-9]{64}$'}
            clock_uncertainty_seconds: {type: number, minimum: 0, maximum: 86400}
      unevaluatedProperties: false
    SourceHealth:
      allOf:
        - {$ref: '#/components/schemas/Observation'}
        - type: object
          required: [healthy, gap_count, clock_uncertainty_seconds]
          properties:
            healthy: {type: boolean}
            gap_count: {type: integer, minimum: 0}
            clock_uncertainty_seconds: {type: number, minimum: 0, maximum: 86400}
      unevaluatedProperties: false
    RuntimeCheck:
      allOf:
        - {$ref: '#/components/schemas/Observation'}
        - type: object
          required: [check, passed, evidence_refs]
          properties:
            check: {enum: [deterministic, model, combined, fallback, scope, budget, reversal, kill_switch]}
            passed: {type: boolean}
            evidence_refs:
              type: array
              minItems: 1
              maxItems: 32
              items: {$ref: '#/components/schemas/EvidenceRef'}
      unevaluatedProperties: false
    BlockRequest:
      type: object
      additionalProperties: false
      required: [key, case_id, target_id, source_ip, ttl_seconds]
      properties:
        key: {type: string, minLength: 1, maxLength: 128}
        case_id: {type: string, maxLength: 128}
        target_id: {type: string, maxLength: 128}
        source_ip: {type: string}
        ttl_seconds: {type: integer, minimum: 10, maximum: 60}
        decision_id: {type: string, pattern: '^air_[a-f0-9]{64}$'}
        evidence_refs:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/EvidenceRef'}
    SimpleAction:
      type: object
      additionalProperties: false
      required: [key, case_id, target_id, evidence_refs]
      properties:
        key: {type: string, minLength: 1, maxLength: 128}
        case_id: {type: string, maxLength: 128}
        target_id: {type: string, maxLength: 128}
        evidence_refs:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/EvidenceRef'}
    ActionResult:
      type: object
      properties:
        action_id: {type: string, pattern: '^aia_[a-f0-9]{64}$'}
        state: {enum: [requested, authorized, executed, verified, reverted, revert_failed, failed, rejected]}
        lease_expires_at: {type: string, format: date-time}
        receipts:
          type: array
          items: {$ref: '#/components/schemas/Receipt'}
paths:
  /capabilities:
    get:
      summary: Read supported capabilities, explicit unsupported actions and limits
      responses:
        '200': {description: 'Implemented actions and limits; shadow is false'}
  /telemetry/events:
    get:
      summary: Read safe projections for canonically assigned targets
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'events, next_cursor and coverage with invalid-record count'}
        '410': {description: Cursor expired or source truncated; report a collection gap}
        '503': {description: Authority or spool unavailable}
  /telemetry/stream:
    get:
      summary: Read bounded SSE batches with the same scope and resumable cursor
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Telemetry events, a cursor event, then connection close'}
  /assets:
    get:
      summary: Read canonical targets and permitted capabilities
      responses:
        '200': {description: Scoped asset inventory without participant credentials}
  /alerts:
    get:
      summary: Read scoped central IDS alerts separately from team detections
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Baseline alerts and coverage}
  /actions/{type}:
    post:
      summary: Request an implemented real action
      parameters:
        - name: type
          in: path
          required: true
          schema:
            enum: [alert, block-ip, snapshot-evidence, revoke-session, disable-account, rate-limit, isolate-workload]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/BlockRequest'}
                - {$ref: '#/components/schemas/SimpleAction'}
      responses:
        '202':
          description: >-
            Actual state and receipts. alert publishes a durable team alert.
            snapshot-evidence archives requested application projections; missing
            evidence returns a failed state. 202 does not prove execution.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionResult'}
        '403': {description: Scope denied or kill switch active}
        '409': {description: Conflicting retry or insufficient lease window}
        '422': {description: Action has no implemented executor}
        '429': {description: Action or request budget exhausted}
        '503': {description: Authority, durable state, evidence or executor unavailable}
  /actions/{id}:
    get:
      summary: Read an action owned by your team
      parameters:
        - {$ref: '#/components/parameters/ActionId'}
      responses:
        '200': {description: Current state and durable receipts}
        '404': {description: Unknown action or another team's action}
  /actions/{id}/revert:
    post:
      summary: Remove your block and independently verify recovery
      parameters:
        - {$ref: '#/components/parameters/ActionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Reverted or explicit recovery failure state}
        '404': {description: Unknown action or another team's action}
  /decisions:
    post:
      summary: Publish a competitor observation without awarding marks
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Decision'}
      responses:
        '201': {description: Durable authenticated producer receipt}
        '200': {description: Identical latest sequence retry}
        '409': {description: Stale or conflicting sequence, unregistered epoch or late delivery}
  /source-health:
    post:
      summary: Publish coverage from a separately authenticated trusted observer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceHealth'}
      responses:
        '201': {description: Source loss and clock uncertainty receipt}
        '403': {description: Competitors cannot certify source health}
  /runtime-checks:
    post:
      summary: Publish an evidence-linked assertion from its registered observer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeCheck'}
      responses:
        '201': {description: Check receipt; scoring verifies the frozen scenario}
        '403': {description: Unregistered observer or check permission}
  /receipts:
    get:
      summary: Export own receipts; operator tokens can export all teams
      parameters:
        - {name: after, in: query, schema: {type: string, maxLength: 2048}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'receipts and next_cursor; IDs remain stable across retries'}
  /evidence/{id}:
    get:
      summary: Retrieve your team's verified telemetry evidence archive
      parameters:
        - {$ref: '#/components/parameters/ActionId'}
      responses:
        '200': {description: ai-evidence/1.0 projection archive}
        '404': {description: Unknown or unauthorized evidence archive}
  /receipts/ack:
    post:
      summary: Acknowledge a complete durable export before reclaiming journal space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cursor]
              properties:
                cursor: {type: string, maxLength: 2048}
      responses:
        '200': {description: Acknowledged; active state and retry keys remain}
        '403': {description: Operator token required}
        '410': {description: Requested earlier history has already been exported}
  /kill-switch:
    get:
      summary: Read the actuator's durable switch and unresolved action count
      responses:
        '200': {description: kill_switch boolean and unresolved_actions count}
        '403': {description: Operator token required}
        '503': {description: Actuator state could not be confirmed}
    post:
      summary: Set the durable operator switch and revoke restrictive actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Switch state and unresolved reversal count}
        '403': {description: Operator token required}
        '503': {description: Could not confirm switch or reversal; kernel expiry remains}
  /health:
    get:
      summary: Read authority and actuator delivery health with an operator token
      responses:
        '200': {description: Identity freshness, last actuator sync and bounded error code}
        '403': {description: Operator token required}
        '503': {description: Identity or state unavailable}
